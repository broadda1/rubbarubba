    #eightBall {
        width: 180px;
        height: 180px;
        margin: 0 auto;
        border-radius: 50%;
        border: 5px solid #333;
        background:
            radial-gradient(circle at 35% 25%, #555 0%, #181818 25%, #000 65%);
        box-shadow:
            0 12px 30px rgba(0,0,0,.8),
            inset -15px -18px 30px rgba(0,0,0,.8);
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        user-select: none;
        transition: transform .15s;
    }

    #eightBall:hover {
        transform: scale(1.04);
    }

    #eightBall:active {
        transform: scale(.96);
    }

    .eight {
        width: 82px;
        height: 82px;
        border-radius: 50%;
        background: white;
        color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 58px;
        font-weight: bold;
        box-shadow: inset 0 0 8px #777;
    }

    .shake {
        animation: shake .85s;
    }

    @keyframes shake {
        0%   { transform: translate(0,0) rotate(0); }
        10%  { transform: translate(-14px,-3px) rotate(-7deg); }
        20%  { transform: translate(14px,3px) rotate(7deg); }
        30%  { transform: translate(-13px,2px) rotate(-6deg); }
        40%  { transform: translate(13px,-2px) rotate(6deg); }
        50%  { transform: translate(-10px,-3px) rotate(-5deg); }
        60%  { transform: translate(10px,3px) rotate(5deg); }
        70%  { transform: translate(-7px,1px) rotate(-3deg); }
        80%  { transform: translate(7px,-1px) rotate(3deg); }
        90%  { transform: translate(-3px,0) rotate(-1deg); }
        100% { transform: translate(0,0) rotate(0); }
    }

    .disabled {
        cursor: default !important;
        opacity: .65;
    }

    .footer {
        margin-top: 45px;
        color: #777;
        font-size: 14px;
        letter-spacing: 3px;
    }

let lastResponse = -1;

}

function askBall() {

    if (locked) return;

    pressCount++;

    ball.classList.remove("shake");
    void ball.offsetWidth;
    ball.classList.add("shake");

    instruction.textContent = "The Rubba Ball is thinking...";

    if (pressCount > 5) {

        locked = true;

        setTimeout(() => {
            message.textContent =
                "Don't you have something better to do, you worthless FUCK!";

            instruction.textContent =
                "The Rubba Ball is done with you.";

            ball.classList.remove("shake");
            ball.classList.add("disabled");
        }, 850);

        return;
    }

    let index;

    do {
        index = Math.floor(Math.random() * responses.length);
    } while (index === lastResponse && responses.length > 1);

    lastResponse = index;

    setTimeout(() => {
        message.textContent = responses[index];
        instruction.textContent =
            "Say another question out loud and press the 8 ball";
        ball.classList.remove("shake");
    }, 850);
}

ball.addEventListener("click", askBall);

ball.addEventListener("keydown", function(event) {

});
